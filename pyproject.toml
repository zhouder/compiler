[project]
name = "compiler"
version = "0.1.0"
description = "A compiler for C-subset language implemented in Python"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "zhouder" }
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--maxfail=1 --tb=short"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "C", "B"]
ignore = ["E501", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["lexer", "parser", "semantic", "ir", "codegen"]
